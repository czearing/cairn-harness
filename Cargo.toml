[package]
name = "cairn-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-client-protocol = "1.2.0"
anyhow = "1.0.103"
blake3 = "1.8.5"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "process", "sync", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.23.5", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
